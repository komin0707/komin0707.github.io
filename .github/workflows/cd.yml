name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, tag, or branch to deploy for production or rollback'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:no-raster
      - run: npm run check:bundle-size
      - run: npm run check:cost-monitoring
      - uses: actions/upload-artifact@v4
        with:
          name: static-build-${{ github.sha }}
          path: dist
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: cost-monitoring-${{ github.sha }}
          path: artifacts/cost-monitoring.json
          retention-days: 30
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-staging:
    if: github.event_name == 'push'
    needs: build-static
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    needs: build-static
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
