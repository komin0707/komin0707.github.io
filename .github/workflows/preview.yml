name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:no-raster
      - run: npm run check:bundle-size
      - run: npm run check:cost-monitoring
      - uses: actions/upload-artifact@v4
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: preview-cost-pr-${{ github.event.pull_request.number }}
          path: artifacts/cost-monitoring.json
          retention-days: 14
