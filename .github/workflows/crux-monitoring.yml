name: CrUX Monitoring

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: crux-monitoring
  cancel-in-progress: false

jobs:
  check-crux-field-data:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check GitHub Pages production domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-pages-domain.mjs
      - name: Check CrUX credential preflight
        id: crux_credentials
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node .github/scripts/check-crux-credentials.mjs
      - name: Check Chrome UX Report monitoring
        id: crux
        continue-on-error: true
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CRUX_CACHE_SCAN: '1'
        run: node .github/scripts/check-crux-monitoring.mjs
      - name: Check direct CrUX/PageSpeed live probes
        id: crux_live_probes
        continue-on-error: true
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node .github/scripts/check-crux-live-probes.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-ux-report-monitoring
          path: |
            artifacts/manual-evidence/github-pages-domain.json
            artifacts/manual-evidence/chrome-ux-report-credentials.json
            artifacts/manual-evidence/chrome-ux-report-monitoring.json
            artifacts/manual-evidence/crux-live-probe.json
            artifacts/manual-evidence/pagespeed-live-probe.json
            artifacts/manual-evidence/chrome-ux-report.json
          retention-days: 30
      - name: Summarize CrUX status
        run: |
          node -e "const fs=require('node:fs'); const a=JSON.parse(fs.readFileSync('artifacts/manual-evidence/chrome-ux-report-monitoring.json','utf8')); const cache=a.checks.cruxCache; const d=a.checks.discoverability; console.log(JSON.stringify({result:a.result, origin:a.origin, discoverable:d.homeStatus===200 && !d.noIndexPresent && d.robotsAllowsAll && d.sitemapHasOrigin, latestMonth:cache.latestMonth, scannedChunks:cache.scannedChunks, foundOrigin:cache.foundOrigin}, null, 2));"
      - name: Close CrUX blocker issue when field data is available
        if: steps.crux.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = 'crux-monitoring-field-data-blocker';
            const { data: existingIssues } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open ${marker}`,
            });
            if (existingIssues.total_count > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues.items[0].number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
      - name: Open or update CrUX blocker issue
        if: steps.crux.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const artifact = JSON.parse(fs.readFileSync('artifacts/manual-evidence/chrome-ux-report-monitoring.json', 'utf8'));
            const credentials = fs.existsSync('artifacts/manual-evidence/chrome-ux-report-credentials.json')
              ? JSON.parse(fs.readFileSync('artifacts/manual-evidence/chrome-ux-report-credentials.json', 'utf8'))
              : null;
            const pagesDomain = fs.existsSync('artifacts/manual-evidence/github-pages-domain.json')
              ? JSON.parse(fs.readFileSync('artifacts/manual-evidence/github-pages-domain.json', 'utf8'))
              : null;
            const liveCruxProbe = fs.existsSync('artifacts/manual-evidence/crux-live-probe.json')
              ? JSON.parse(fs.readFileSync('artifacts/manual-evidence/crux-live-probe.json', 'utf8'))
              : null;
            const livePageSpeedProbe = fs.existsSync('artifacts/manual-evidence/pagespeed-live-probe.json')
              ? JSON.parse(fs.readFileSync('artifacts/manual-evidence/pagespeed-live-probe.json', 'utf8'))
              : null;
            const liveProbeStatus = (name) => {
              const probe = liveCruxProbe?.probes?.find((entry) => entry.name === name);
              return probe?.status ?? 'unavailable';
            };
            const liveProbeRecord = (name) => {
              const probe = liveCruxProbe?.probes?.find((entry) => entry.name === name);
              return probe?.recordPresent === true ? 'present' : 'absent';
            };
            const nonAcceptedCredentialNames = (value) => {
              if (!value?.checked) return 'unchecked';
              const envFileNames = Array.isArray(value.envFileNames)
                ? value.envFileNames.flatMap((entry) => Array.isArray(entry.names) ? entry.names : [])
                : [];
              const localEnvironmentNames = Array.isArray(value.localEnvironmentNames)
                ? value.localEnvironmentNames
                : [];
              const names = [...new Set([...envFileNames, ...localEnvironmentNames])].sort();
              return names.length > 0 ? names.join(', ') : 'none';
            };
            const marker = 'crux-monitoring-field-data-blocker';
            const title = '[blocked] Chrome UX Report field data unavailable';
            const body = [
              'Chrome UX Report monitoring ran, but field data is not available yet.',
              '',
              `Origin: ${artifact.origin}`,
              `Target URL: ${artifact.targetUrl}`,
              `Result: ${artifact.result}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Latest public CrUX cache month: ${artifact.checks.cruxCache.latestMonth}`,
              `Public CrUX cache chunks scanned: ${artifact.checks.cruxCache.scannedChunks}/${artifact.checks.cruxCache.totalChunks}`,
              `Origin found in public CrUX cache: ${artifact.checks.cruxCache.foundOrigin}`,
              `CrUX API key configured: ${artifact.checks.cruxApi.hasApiKey}`,
              `CrUX API origin status: ${artifact.checks.cruxApi.originRecord.status}`,
              `CrUX API URL status: ${artifact.checks.cruxApi.urlRecord.status}`,
              `PageSpeed API key configured: ${artifact.checks.pageSpeed.hasApiKey}`,
              `PageSpeed API status: ${artifact.checks.pageSpeed.status}`,
              `Direct CrUX live probe origin status: ${liveProbeStatus('origin')}`,
              `Direct CrUX live probe URL status: ${liveProbeStatus('url')}`,
              `Direct CrUX live probe records: ${liveProbeRecord('origin')}/${liveProbeRecord('url')}`,
              `Direct PageSpeed live probe status: ${livePageSpeedProbe?.status ?? 'unavailable'}`,
              `Direct PageSpeed loadingExperience: ${livePageSpeedProbe?.hasLoadingExperience === true ? 'present' : 'absent'}`,
              `Direct PageSpeed originLoadingExperience: ${livePageSpeedProbe?.hasOriginLoadingExperience === true ? 'present' : 'absent'}`,
              `Pages domain result: ${pagesDomain?.result ?? 'unavailable'}`,
              `Pages connected origins: ${(pagesDomain?.connectedOrigins ?? []).join(', ') || 'none'}`,
              `Pages CNAME: ${pagesDomain?.cnameFile?.exists ? pagesDomain.cnameFile.value : 'absent'}`,
              `Credential preflight result: ${credentials?.result ?? 'unavailable'}`,
              `Credential preflight monitor key source: ${credentials?.monitorApiKeySource?.source ?? 'unavailable'}`,
              `Credential preflight usable exported env names: ${(credentials?.usableByCurrentMonitor?.localEnvironmentNames ?? []).join(', ') || 'none'}`,
              `Credential preflight usable env-file names: ${(credentials?.usableByCurrentMonitor?.envFileNames ?? []).join(', ') || 'none'}`,
              `Credential preflight usable GitHub secret names: ${(credentials?.usableByCurrentMonitor?.githubSecretNames ?? []).join(', ') || 'none'}`,
              `Credential preflight usable GitHub environment secret names: ${(credentials?.githubEnvironments?.acceptedPresent?.secrets ?? []).join(', ') || 'none'}`,
              `Credential preflight usable GitHub environment variable names: ${(credentials?.githubEnvironments?.acceptedPresent?.variables ?? []).join(', ') || 'none'}`,
              `Credential preflight non-accepted local credential names: ${nonAcceptedCredentialNames(credentials?.nonAcceptedCredentialNames)}`,
              '',
              'Unblock conditions:',
              '- Configure CRUX_API_KEY, PAGESPEED_API_KEY, or GOOGLE_API_KEY with Chrome UX Report/PageSpeed API quota, and',
              '- Wait until the production origin has enough real-user Chrome traffic to expose CrUX field data.',
              '',
              'Operator next steps:',
              '- gh secret set PAGESPEED_API_KEY --repo komin0707/komin0707.github.io',
              '- gh secret set PAGESPEED_API_KEY --repo komin0707/komin0707.github.io --env github-pages',
              '- gh workflow run "CrUX Monitoring" --repo komin0707/komin0707.github.io',
              '- npm run refresh:crux-blocker-evidence',
              '',
              marker,
            ].join('\n');
            const { data: existingIssues } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open ${marker}`,
            });
            if (existingIssues.total_count > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues.items[0].number,
                body,
                title,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['blocked', 'crux'],
              });
            }
      - name: Fail when field data is unavailable
        if: steps.crux.outcome == 'failure'
        run: |
          echo "Chrome UX Report field data is not available yet. Check the uploaded chrome-ux-report-monitoring artifact."
          exit 1
